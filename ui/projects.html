<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects · Product Graph</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/projects.css" data-workspace-style></head>
<body class="projects-page">
<header class="projects-header"><a href="/" class="project-brand">◇ Product Graph</a><span>LOCAL WORKSPACE</span><label>Appearance <select id="appearance"><option value="light">Paper</option><option value="dark">Dark</option><option value="system">System</option></select></label></header>
